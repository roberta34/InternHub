$kind: http-request
url: "{{baseUrl}}/api/{{apiVersion}}/offers/{{offerId}}/close"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test('204 No Content on repeated close', () => pm.response.to.have.status(204));
      pm.test('Response body is empty', () => pm.expect(pm.response.text()).to.eql(''));
    language: text/javascript
order: 4000
