$kind: http-request
url: "{{baseUrl}}/api/{{apiVersion}}/offers/{{offerId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        const offer = pm.response.json();
        pm.test('Expected Offer is open', () => {
          pm.expect(offer.id).to.eql(pm.collectionVariables.get('offerId'));
          pm.expect(offer.isClosed).to.eql(false);
          pm.expect(offer.version).to.be.a('number');
        });
        if (offer.isClosed === false && Number.isInteger(offer.version)) {
          pm.collectionVariables.set('closeOfferVersionBefore', String(offer.version));
        }
      }
    language: text/javascript
order: 1000
