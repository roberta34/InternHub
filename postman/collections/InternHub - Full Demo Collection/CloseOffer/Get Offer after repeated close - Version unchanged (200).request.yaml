$kind: http-request
url: "{{baseUrl}}/api/{{apiVersion}}/offers/{{offerId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        const offer = pm.response.json();
        pm.test('Offer stays closed and Version does not increment again', () => {
          pm.expect(offer.isClosed).to.eql(true);
          pm.expect(offer.version).to.eql(Number(pm.collectionVariables.get('closeOfferVersionAfterFirst')));
        });
      }
    language: text/javascript
order: 5000
