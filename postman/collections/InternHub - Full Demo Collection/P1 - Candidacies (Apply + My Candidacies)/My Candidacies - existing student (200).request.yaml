$kind: http-request
url: "{{baseUrl}}/api/{{apiVersion}}/students/{{p1StudentId}}/candidacies"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const items = pm.response.json();
      pm.test('Contains the created candidacy', () => {
        pm.expect(items).to.be.an('array').with.lengthOf(1);
        pm.expect(items[0].offerId).to.eql(pm.collectionVariables.get('p1OfferId'));
        pm.expect(items[0].offerTitle).to.eql('Backend Intern');
        pm.expect(items[0].companyName).to.eql('Example Co');
      pm.expect(items[0].status).to.eql(0);
      });
    language: text/javascript
order: 8000
