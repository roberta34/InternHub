$kind: http-request
url: "{{baseUrl}}/api/{{apiVersion}}/candidacies"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{ "studentId": "11111111-1111-4111-8111-111111111111", "offerId": "{{p1OfferId}}" }'
scripts:
