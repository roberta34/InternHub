$kind: http-request
url: "{{baseUrl}}/api/{{apiVersion}}/offers"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{ "title": "Backend Intern", "companyName": "Example Co", "requirements": "C#", "deadline": "{{p1Deadline}}", "maximumAvailableSlots": 2 }'
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('p1Deadline', new Date(Date.now() + 7 * 86400000).toISOString());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('201 Created', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('p1OfferId', pm.response.json().id);
    language: text/javascript
order: 2000
