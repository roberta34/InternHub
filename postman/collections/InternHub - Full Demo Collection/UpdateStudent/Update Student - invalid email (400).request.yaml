$kind: http-request
url: "{{baseUrl}}/api/{{apiVersion}}/students/{{studentId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Updated Student",
      "email": "invalid-email"
    }
scripts:
  - type: afterResponse
    code: pm.test('400 Bad Request', () => pm.response.to.have.status(400));
    language: text/javascript
order: 3000
