$kind: http-request
url: "{{baseUrl}}/api/{{apiVersion}}/students/{{studentId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Updated Student",
      "email": "{{updatedStudentEmail}}"
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('updatedStudentEmail', 'updated.' + Date.now() + '@example.com');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('204 No Content', () => pm.response.to.have.status(204));
      pm.test('Response body is empty', () => pm.expect(pm.response.text()).to.eql(''));
    language: text/javascript
order: 1000
