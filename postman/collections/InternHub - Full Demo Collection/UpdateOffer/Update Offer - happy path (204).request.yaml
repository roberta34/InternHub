$kind: http-request
url: "{{baseUrl}}/api/{{apiVersion}}/offers/{{offerId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Updated Backend Internship",
      "companyName": "InternHub Demo Company 2",
      "requirements": "C#, .NET 10, SQLite",
      "deadline": "{{updateDeadline}}",
      "maximumAvailableSlots": 5,
      "version": {{offerVersion}}
    }
scripts:
  - type: beforeRequest
    code: pm.variables.set('updateDeadline', new Date(Date.now() + 45 * 24 * 60 * 60 * 1000).toISOString());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('204 No Content', () => pm.response.to.have.status(204));
      pm.test('Response body is empty', () => pm.expect(pm.response.text()).to.eql(''));
      if (pm.response.code === 204) {
        const previousVersion = Number(pm.collectionVariables.get('offerVersion'));
        pm.collectionVariables.set('staleOfferVersion', previousVersion);
        pm.collectionVariables.set('offerVersion', previousVersion + 1);
      }
    language: text/javascript
order: 1000
