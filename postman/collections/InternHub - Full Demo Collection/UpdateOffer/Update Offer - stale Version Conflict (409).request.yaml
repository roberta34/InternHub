$kind: http-request
url: "{{baseUrl}}/api/{{apiVersion}}/offers/{{offerId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Should Not Persist - Stale Update",
      "companyName": "Should Not Persist Ltd",
      "requirements": "C#, .NET 10, SQLite",
      "deadline": "{{updateDeadline}}",
      "maximumAvailableSlots": 5,
      "version": {{staleOfferVersion}}
    }
scripts:
  - type: beforeRequest
    code: pm.variables.set('updateDeadline', new Date(Date.now() + 45 * 24 * 60 * 60 * 1000).toISOString());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('409 Conflict', () => pm.response.to.have.status(409));
      pm.test('Conflict explains stale version', () => pm.expect(pm.response.text().toLowerCase()).to.include('stale version'));
    language: text/javascript
order: 5000
