$kind: http-request
url: "{{baseUrl}}/api/{{apiVersion}}/candidacies/{{p4CandidacyBId}}/decision"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{ "action": "Accept" }'
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('Status is Waitlisted (4)', () => pm.expect(pm.response.json().status).to.eql(4));
    language: text/javascript
order: 4000
