$kind: http-request
url: "{{baseUrl}}/api/{{apiVersion}}/candidacies/{{p4CandidacyAId}}/decision"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{ "action": "Accept" }'
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('Status is Accepted (2)', () => pm.expect(pm.response.json().status).to.eql(2));
    language: text/javascript
order: 2000
