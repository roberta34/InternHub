$kind: http-request
url: "{{baseUrl}}/api/{{apiVersion}}/students/{{conflictFirstStudentId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const student = pm.response.json();
      pm.test('First student preserves original data', () => {
        pm.expect(student.id).to.eql(pm.collectionVariables.get('conflictFirstStudentId'));
        pm.expect(student.fullName).to.eql('Conflict First Student');
        pm.expect(student.email).to.eql(pm.collectionVariables.get('conflictFirstStudentEmail'));
      });
    language: text/javascript
order: 4000
