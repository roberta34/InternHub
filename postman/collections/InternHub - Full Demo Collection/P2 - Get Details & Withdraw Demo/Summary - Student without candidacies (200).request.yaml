$kind: http-request
url: "{{baseUrl}}/api/{{apiVersion}}/students/{{p2DemoStudentBId}}/candidacies/summary"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Student ID is Student B', () => pm.expect(body.studentId).to.eql(pm.collectionVariables.get('p2DemoStudentBId')));
      pm.test('All counts are zero', () => pm.expect([body.totalCount, body.activeCount, body.submittedCount, body.shortlistedCount, body.acceptedCount, body.rejectedCount, body.waitlistedCount, body.withdrawnCount]).to.eql([0, 0, 0, 0, 0, 0, 0, 0]));
    language: text/javascript
order: 11000
