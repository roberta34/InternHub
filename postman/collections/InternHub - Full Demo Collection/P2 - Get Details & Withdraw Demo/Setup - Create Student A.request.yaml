$kind: http-request
url: "{{baseUrl}}/api/{{apiVersion}}/students"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{ "fullName": "P2 Demo Student A", "email": "{{p2DemoStudentAEmail}}" }'
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('p2DemoStudentAEmail', 'p2-demo-a-' + pm.variables.replaceIn('{{$guid}}') + '@example.test');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('201 Created', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('p2DemoStudentAId', pm.response.json().id);
      pm.test('Student A ID captured', () => pm.expect(pm.collectionVariables.get('p2DemoStudentAId')).to.be.a('string').and.not.empty);
    language: text/javascript
order: 1000
