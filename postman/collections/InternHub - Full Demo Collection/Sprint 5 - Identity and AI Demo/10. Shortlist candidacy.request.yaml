$kind: http-request
url: "{{baseUrl}}/api/{{apiVersion}}/candidacies/{{sprintCandidacyId}}/decision"
method: POST
headers:
  Authorization: Bearer {{sprintRecruiterToken}}
  Content-Type: application/json
body:
  type: text
  content: '{ "action": "Shortlist" }'
scripts:
  - type: beforeRequest
    code: |-
      if (!pm.collectionVariables.get('sprintCandidacyId')) {
        throw new Error('Run request 6 first to create the candidacy.');
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('Candidacy shortlisted', () => pm.expect(pm.response.json().status).to.eql(1));
    language: text/javascript
order: 10000
