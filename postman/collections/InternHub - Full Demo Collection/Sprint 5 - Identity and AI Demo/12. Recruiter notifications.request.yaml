$kind: http-request
url: "{{baseUrl}}/api/{{apiVersion}}/recruiters/me/notifications"
method: GET
headers:
  Authorization: Bearer {{sprintRecruiterToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('Notifications is a list', () => pm.expect(pm.response.json()).to.be.an('array'));
    language: text/javascript
order: 12000
